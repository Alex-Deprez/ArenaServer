name: Image serveur

# À chaque push sur main : export du serveur Godot (amd64 + arm64)
# puis publication de l'image sur ghcr.io.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Doit correspondre à la version de l'éditeur Godot utilisée pour le projet.
  GODOT_VERSION: "4.5"
  IMAGE: ghcr.io/alex-deprez/arena-server

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Télécharger Godot et les modèles d'export
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/tpl
          dir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dir"
          mv /tmp/tpl/templates/* "$dir/"

      - name: Exporter le serveur
        run: |
          godot=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          mkdir -p build/server
          "$godot" --headless --import
          "$godot" --headless --export-release "Serveur Linux amd64" build/server/arena_server.amd64
          "$godot" --headless --export-release "Serveur Linux arm64" build/server/arena_server.arm64
          ls -lh build/server

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
